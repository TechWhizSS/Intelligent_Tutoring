name: Android app
on:
  push:
    branches: [codex/development]
    paths: ['android/**', 'app/content.py', 'data/**', 'scripts/build_android_content.py', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python scripts/build_android_content.py
      - run: git diff --exit-code -- android/app/src/main/assets/syllabus.json
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: SyllabusToSong-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
